name: Static site checks
on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate local HTML references
        run: python3 scripts/check_site.py
      - name: Check JavaScript syntax
        run: find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n 1 node --check
      - name: Test Bnum arithmetic
        run: node --test tests/bnum.test.cjs
