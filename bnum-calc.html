<link rel="stylesheet" href="style.css">

<style>
body{
    font-size:16px;
    line-height:1.6;
}

.logo{
    font-size:18px;
    font-weight:600;
}

.nav-links a{
    font-size:14px;
}

.hero h1{
    font-size:42px;
    line-height:1.1;
    margin-bottom:10px;
}

.hero p{
    font-size:16px;
    opacity:.85;
}

.badge{
    font-size:12px;
}

.btn{
    font-size:14px;
    cursor:pointer;
    border:none;
}

input, select{
    width:100%;
    padding:12px;
    margin-top:12px;
    border:none;
    border-radius:12px;
    font-size:16px;
}

.result{
    margin-top:22px;
    font-size:28px;
    font-weight:700;
    word-break:break-word;
}

.subtext{
    margin-top:8px;
    opacity:.75;
    font-size:14px;
    word-break:break-word;
}
label{display:block;text-align:left;margin-top:12px;font-weight:650}.result.error{color:#fda4af}#calcForm .btn{width:100%}</style>
<link rel="stylesheet" href="site-polish.css">

<body>

<a class="skip-link" href="#main-content">Skip to content</a>
<nav class="site-nav" aria-label="Main navigation">
  <a class="site-logo" href="index.html">SillyDev<span>2026</span></a>
  <button class="site-menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav-links" aria-label="Toggle site navigation">☰ <span>Menu</span></button>
  <div class="nav-links" id="site-nav-links">
    <a href="index.html">Home</a><a href="about.html">About</a><a href="projects.html">Projects</a>
    <a href="roblox.html">Roblox Hub</a><a href="links.html">Links</a><a href="contact.html">Contact</a>
  </div>
</nav>

<main id="main-content" class="container">

<section class="hero">
<form class="card hero-card" id="calcForm">

<span class="badge">Calculator</span>

<h1>Bnum Calc</h1>

<p>
Big number calculator using your Bnum system.<br>
Examples: 1e6, 5e12, 999999999
</p>

<label for="num1">First number</label><input id="num1" type="text" inputmode="decimal" autocomplete="off" placeholder="e.g. 1e3000">

<label for="num2">Second number</label><input id="num2" type="text" inputmode="decimal" autocomplete="off" placeholder="e.g. 2.5e20">

<label for="op">Operation</label><select id="op">
<option value="add">Add (+)</option>
<option value="sub">Subtract (-)</option>
<option value="mul">Multiply (×)</option>
<option value="div">Divide (÷)</option>
<option value="pow">Power (^)</option>
<option value="log">Log Base</option>
</select>

<div style="margin-top:18px;">
<button class="btn primary" type="submit">Calculate</button>
</div>

<div class="result" id="result" role="status" aria-live="polite">0</div>
<div class="subtext" id="raw" aria-live="polite">Ready</div>

</form>
</section>
</main>

<script src="bnum.js"></script>
<script src="calculator.js"></script>

</body>
