<!DOCTYPE html>
<html lang="en">
<head>
<title>Roblox Hub</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="SillyDev2026 developer portfolio: Roblox modules, Luau documentation, big-number tools and open-source projects.">

<link rel="stylesheet" href="style.css">

<style>

body {
    font-size: 16px;
    line-height: 1.6;
}

nav a { font-size: 14px; }
.logo { font-size: 18px; font-weight: 600; }

.container h1 {
    font-size: 30px;
    margin-bottom: 6px;
}

.container p {
    font-size: 14px;
    opacity: 0.8;
}

.card {
    padding: 18px;
}

.card h3 {
    font-size: 18px;
    margin-bottom: 6px;
}

.card p {
    font-size: 14px;
    opacity: 0.85;
}

label {
    font-size: 14px;
    opacity: 0.85;
}

select, input {
    font-size: 14px;
    padding: 6px;
}

.btn {
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.grid {
    gap: 16px;
}

footer {
    font-size: 13px;
    opacity: 0.7;
}

.settings {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.button-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 12px;
}

.pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 28px;
}

#hubError{color:#fda4af}.settings input{width:min(100%,25rem)}.pagination button{flex-shrink:0}</style>

<link rel="stylesheet" href="site-polish.css">
<script src="site.js" defer></script>
</head>

<body>

<a class="skip-link" href="#main-content">Skip to content</a>
<nav class="site-nav" aria-label="Main navigation">
  <a class="site-logo" href="index.html">SillyDev<span>2026</span></a>
  <button class="site-menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav-links" aria-label="Toggle site navigation">☰ <span>Menu</span></button>
  <div class="nav-links" id="site-nav-links">
    <a href="index.html">Home</a><a href="about.html">About</a><a href="projects.html">Projects</a>
    <a href="roblox.html">Roblox Hub</a><a href="links.html">Links</a><a href="contact.html">Contact</a>
  </div>
</nav>

<div id="main-content" class="container">

    <h1>🎮 Roblox Hub</h1>
    <p>Select category and browse SillyDev2026 creations</p>

    <!-- SETTINGS -->
    <div class="card settings">

        <div>
            <label for="categorySelect">Category</label><br>
            <select id="categorySelect">
                <option value="games">Games</option>
                <option value="modules" selected>Modules</option>
            </select>
        </div>

        <div>
            <label for="limitInput">Items per page (5 - 25)</label><br>
            <input id="limitInput" type="number" value="6" min="5" max="25">
        </div>

        <div><label for="hubSearch">Search</label><br><input id="hubSearch" type="search" placeholder="Find a module or tool" autocomplete="off"></div>\n        <div class="button-row">
            <button class="btn primary" id="applyBtn">Apply</button>
        </div>

    </div>

    <!-- GRID -->
    <section id="grid" class="grid" aria-live="polite"></section>

    <!-- PAGINATION -->
    <div class="pagination">
        <button class="btn dark" id="backBtn">⬅ Back</button>
        <span id="pageInfo"></span>
        <button class="btn dark" id="nextBtn">Next ➡</button>
    </div>

</div>

<footer>© 2026 SillyDev2026</footer>

<script src="roblox-hub.js"></script>

</body>
</html>
